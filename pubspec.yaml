name: pokedex_flutter
description: An offline-first Flutter Pokédex.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  audioplayers: ^6.8.1
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  # Pinned below 2.34.1+1: newer drift_dev requires analyzer ^13 which
  # conflicts with freezed 3.x (analyzer <11).
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  image: 4.9.2
flutter_launcher_icons:
  image_path: "assets/icon/pokedex.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 48
  web:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/thumbnails/
    - assets/home/
    - assets/home_shiny/
    - assets/types/
    - assets/images/
    - assets/pokedex_seed.json
    - assets/moves_seed.json
    - assets/items_seed.json
    - assets/abilities_seed.json
    - assets/natures_seed.json
    - assets/name_forms.json
    - assets/species_fallback.json
    - assets/champions_seed.json
    - assets/speed_tiers.json

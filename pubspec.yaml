name: pokedex_flutter
description: A high-performance offline-first Flutter Pokedex.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.1
  path: ^1.8.3
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/thumbnails/
    - assets/home/
    - assets/home_shiny/
    - assets/types/
    - assets/pokedex_seed.json
